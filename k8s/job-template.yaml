# Template for n8n to create Claude Code auto-develop jobs.
# n8n fills in: JOB_NAME, REPO, BRANCH, PROMPT, IMAGE
apiVersion: batch/v1
kind: Job
metadata:
  name: "${JOB_NAME}"
  namespace: devllmops-jobs
  labels:
    app.kubernetes.io/part-of: devllmops
    app.kubernetes.io/component: auto-develop
spec:
  activeDeadlineSeconds: 3600
  ttlSecondsAfterFinished: 300
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: devllmops
        app.kubernetes.io/component: auto-develop
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-pull-secret
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        runAsNonRoot: true
        fsGroup: 1001
      containers:
        - name: claude-code
          image: "${IMAGE}"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: REPO
              value: "${REPO}"
            - name: BRANCH
              value: "${BRANCH}"
            - name: PROMPT
              value: "${PROMPT}"
            - name: TIMEOUT
              value: "3600"
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: anthropic-api-key
                  key: key
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-credentials
                  key: token
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: tmp
              mountPath: /tmp
            - name: claude-home
              mountPath: /home/claude
      volumes:
        - name: workspace
          emptyDir: {}
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
        - name: claude-home
          emptyDir:
            sizeLimit: 256Mi
